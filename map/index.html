<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live-Karte – ZEVKEV Minecraft</title>
  <meta name="description" content="Live-Karte des ZEVKEV-Minecraft-Servers (play.zevkev.de): Spieler, Claims und Spawn in Echtzeit.">
  <link rel="canonical" href="https://play.zevkev.de/map/">
  <meta name="theme-color" content="#234d70">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png">
  <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
  <link rel="preload" href="/assets/fonts/BebasNeue-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/css/site.css">
  <script>
    try {
      var saved = localStorage.getItem("zevkev-theme");
      var dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
    } catch (e) { document.documentElement.setAttribute("data-theme", "light"); }
  </script>
  <script src="/assets/js/site.js" defer></script>
</head>
<body class="map-open" data-page="map">
  <!-- Ganze Seite = Karte. Oben die Leiste, damit man jederzeit zurück zur Website kommt. -->
  <div class="map-overlay" id="map-page">
    <div class="map-bar">
      <a class="map-bar-title" href="/" style="text-decoration:none">ZEVKEV <b>Live-Karte</b></a>
      <a class="p-btn rip rip--b" href="http://map.zevkev.de:17165/" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/></svg>
        <span>Neuer Tab</span>
      </a>
      <button class="p-btn rip rip--c" type="button" data-map="fullscreen" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
        <span>Vollbild</span>
      </button>
      <a class="p-btn rip btn-accent" href="/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
        <span class="label-long">Zurück zur Website</span><span class="label-short" aria-hidden="true">Zurück</span>
      </a>
    </div>
    <div class="map-overlay-stage">
      <div class="map-fallback">
        <img src="/assets/img/karte-vorschau.jpg" alt="">
        <p>Die Live-Karte läuft direkt auf dem Spielserver und öffnet sich in einem eigenen Tab – diese Seite bleibt offen.</p>
        <a class="p-btn rip btn-accent" href="http://map.zevkev.de:17165/" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z"/></svg>
          <span>Live-Karte öffnen</span>
        </a>
      </div>
    </div>
  </div>
</body>
</html>
